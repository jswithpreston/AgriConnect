<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework Form</title>
</head>
<style>
    .center {
        align-items: center;
    }
</style>
<body>
    <div class="center">
        <form action="#" method="POST">
            <!-- Name Field -->
            <div class="form-group">
                <label for="userName">Name: </label>
                <input type="text" id="userName" name="userName" placeholder="Enter your full name" required>
            </div>
            <!-- Email Field -->
            <div class="form-group">
                <label for="userEmail">Email: </label>
                <input type="email" id="userEmail" name="userEmail" placeholder="Enter your email" required>
            </div>
            <!-- Password Field -->
            <div class="form-group">
                <label for="userPassword">Password: </label>
                <input type="password" id="userPassword" name="userPassword" placeholder="Enter your password" required>
            </div>
            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
</body>
</html>
